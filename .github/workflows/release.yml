name: release

on:
  push:
    tags: ["v[0-9]*"]

# contents: write is only for `gh release create`. The test and build jobs
# override it to read, so a compromised step there cannot publish.
permissions:
  contents: write

# GOTOOLCHAIN=auto lets a newer toolchain on the runner compile the release.
# The go line in go.mod asks for 1.27.3, and this makes the build use it.
env:
  GOTOOLCHAIN: go1.27.3

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The root package embeds frontend/dist, which only the build job makes.
      # GOTOOLCHAIN=local keeps the go.mod version this step installed: a go
      # line or a toolchain line in a dependency must not fetch another one.
      - run: go vet ./internal/... ./cmd/...
        env:
          GOTOOLCHAIN: local
      - run: go test ./internal/... ./cmd/...
        env:
          GOTOOLCHAIN: local

  build:
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            cgo: "1"
            tags: production,webkit2_41
            asset: subman-linux-amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cgo: "1"
            tags: production,webkit2_41
            asset: subman-linux-arm64
          - os: windows-2025
            goos: windows
            goarch: amd64
            cgo: "0"
            tags: production
            asset: subman-windows-amd64.exe
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            cgo: "0"
            tags: production
            asset: subman-windows-arm64.exe
          - os: macos-15
            goos: darwin
            goarch: arm64
            cgo: "1"
            tags: production
            asset: subman-darwin-arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            cgo: "1"
            tags: production
            asset: subman-darwin-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: WebKitGTK
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun test
        working-directory: frontend
      - run: bun run build
        working-directory: frontend
      - name: compile
        shell: bash
        env:
          # local keeps the go.mod version setup-go installed. A go line or a
          # toolchain line in a dependency must not fetch another toolchain.
          GOTOOLCHAIN: local
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # cgo is only on for linux and darwin. These replace Go's own
          # "-O2 -g" default, so that default is restated here: stack canary,
          # FORTIFY, and position-independent code. -fPIE is a no-op on darwin,
          # which builds PIE by default.
          CGO_CFLAGS: -O2 -g -fstack-protector-strong -D_FORTIFY_SOURCE=2 -fPIE
          # The linker defaults are not hardened. Linux gets a PIE with full
          # RELRO and a non-executable stack; darwin gets its own PIE flags plus
          # the UTType framework Wails' file dialog needs and plain go build
          # does not link. Windows builds with cgo off, so neither applies.
          CGO_LDFLAGS: ${{ matrix.goos == 'linux' && '-O2 -g -pie -Wl,-z,relro,-z,now -Wl,-z,noexecstack' || matrix.goos == 'darwin' && '-O2 -g -Wl,-pie -framework UniformTypeIdentifiers' || '' }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${{ matrix.tags }}" ]; then
            args+=(-tags "${{ matrix.tags }}")
          fi
          ver="${GITHUB_REF_NAME#v}"
          # -buildmode=pie is the default on windows and darwin and refused on
          # neither; linux defaults to a fixed-address executable.
          if [ "${{ matrix.goos }}" = linux ]; then
            args+=(-buildmode=pie -ldflags "-s -w -X main.version=${ver} -linkmode=external -extldflags=-Wl,-z,relro,-z,now")
          else
            args+=(-buildmode=pie -ldflags "-s -w -X main.version=${ver}")
          fi
          go build -buildvcs=false -trimpath \
            "${args[@]}" -o "${{ matrix.asset }}" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          set -eu
          cd dist
          sha256sum subman-* > SHA256SUMS
          cat SHA256SUMS
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
